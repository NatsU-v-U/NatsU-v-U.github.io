<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>和老师的小世界</title>
    
    <!-- 引入适合梦向氛围的优雅英文花体字 (Great Vibes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 保持你喜欢的粉嫩渐变底色 */
            background: linear-gradient(to bottom,
                    #fff7fa 0%,
                    #ffeef5 40%,
                    #fff9fb 100%);
            color: #5e4b52;
            /* 全局中文字体采用典雅的宋体 */
            font-family: "Times New Roman", "Songti SC", "STSong", "SimSun", serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部区域 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        /* 主标题 */
        .main-title {
            font-size: 45px; /* 适当减小了桌面端字号，更有呼吸感 */
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #7d5a66;
            animation: fadeUp 1.5s ease;
        }

        /* 英文副标题 —— 这里帮你缩小了字号，显得更精致不抢戏 */
        .sub-title {
            font-family: 'Great Vibes', cursive; /* 使用引入的英文花体 */
            font-size: 22px; /* ★ 从 32px 缩小到了 22px */
            color: #b28a97;
            margin-bottom: 60px;
            letter-spacing: 1px;
            animation: fadeUp 2s ease;
        }

        /* 双人介绍卡容器 —— 优化了并排逻辑 */
        .card-container {
            width: 100%;
            max-width: 800px; /* 稍微缩窄最大宽度，让两个人靠得更近更亲密 */
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: stretch; /* ★ 让两张卡片的高度永远保持绝对一致 */
            padding: 10px;
        }

        /* 卡片升级：增加淡淡的粉色半透明呼吸感 */
        .profile-card {
            flex: 1; /* ★ 核心修改：让两张卡片平分宽度，在电脑上死死并排 */
            max-width: 360px; /* 限制单张卡片最大宽度 */
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(245, 220, 228, 0.7);
            border-radius: 24px;
            padding: 35px 25px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(125, 90, 102, 0.05);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .profile-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(245, 220, 228, 1);
            box-shadow: 0 15px 35px rgba(245, 220, 228, 0.4);
        }

        /* 头像 */
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 名字 */
        .name {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 6px;
            color: #6d515c;
        }

        /* 英文名 */
        .eng-name {
            font-family: 'Great Vibes', cursive;
            font-size: 20px;
            color: #b78d9b;
            margin-bottom: 25px;
        }

        /* 介绍 */
        .description {
            line-height: 1.8;
            font-size: 14px;
            color: #705b63;
            opacity: 0.9;
        }

        /* 导览区域 */
        .guide {
            margin-top: 80px;
            text-align: center;
            width: 100%;
        }

        .guide-title {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 35px;
            color: #7d5a66;
            letter-spacing: 4px;
        }

        /* 导览按钮 */
        .guide-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 0 20px;
        }

        .guide-buttons a {
            text-decoration: none;
            color: #7d5a66;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(245, 220, 228, 0.5);
            padding: 14px 28px;
            border-radius: 999px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(125, 90, 102, 0.04);
        }

        .guide-buttons a:hover {
            background: #f5dbe4;
            color: #52343e;
            border-color: #f5dbe4;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(245, 220, 228, 0.6);
        }

        /* 动画 */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 📱 手机端深度适配（专为苹果等手机屏幕优化） */
        @media (max-width: 768px) {
            .hero {
                padding: 40px 15px;
            }

            .main-title {
                font-size: 22px; /* 调小字号，确保 iPhone 屏幕绝对不换行 */
                white-space: nowrap; /* 强制单行显示 */
                letter-spacing: 1px;
                margin-bottom: 8px;
            }

            .sub-title {
                font-size: 18px; /* 手机端副标题也等比例缩小 */
                margin-bottom: 45px;
            }

            /* 手机端恢复成上下排列，防止卡片太挤 */
            .card-container {
                flex-direction: column;
                align-items: center;
                gap: 25px;
            }

            .profile-card {
                width: 100%;
                max-width: 300px; /* 让卡片在手机上更精致 */
                padding: 25px 20px;
            }

            .avatar {
                width: 140px;
                height: 140px;
                margin-bottom: 20px;
            }

            .guide {
                margin-top: 60px;
            }

            .guide-buttons {
                flex-direction: column; /* 手机上按钮垂直排列，防止挤压挤变形 */
                align-items: center;
                gap: 15px;
            }

            .guide-buttons a {
                width: 85%;
                max-width: 280px;
                padding: 12px 20px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <h1 class="main-title">
            - 欢迎来到和老师的小世界 -
        </h1>

        <div class="sub-title">
            Aizawa with Kurikawa :)
        </div>

        <!-- 双人介绍 -->
        <div class="card-container">

            <!-- 老师 -->
            <div class="profile-card">
                <img class="avatar" src="aizawa.jpg" alt="相泽消太">
                <div class="name">相泽消太</div>
                <div class="eng-name">Aizawa Shouta</div>
                <div class="description">
                    相泽消太。雄英英雄科教师，前职业英雄，前1-A班班导<br>
                    勾引学生的坏蛋老师。
                                        
                </div>
            </div>

            <!-- 你 -->
            <div class="profile-card">
                <img class="avatar" src="me.jpg" alt="栗川千夏">
                <div class="name">栗川千夏</div>
                <div class="eng-name">Kurikawa Chinatsu</div>
                <div class="description">
                    栗川千夏，职业英雄，前雄英1-A学生。<br>
        
                    被坏蛋老师勾引了。<br>
                    
                </div>
            </div>

        </div>

        <!-- 导览 -->
        <section class="guide">
            <div class="guide-title">导览</div>
            <div class="guide-buttons">
                <a href="Photo.html">私有影像存档^ᵕ^</a>
                <a href="story.html">UA问题生观察日志TuT</a>
                <a href="daily.html">24小时合理性怠情=⩌⩊⩌=</a>
            </div>
        </section>

    </section>

</body>
</html>
